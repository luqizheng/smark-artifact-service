[workspace]
resolver = "3"
members = [
    "apps/artifact-api",
    "apps/artifact-worker",
    "crates/artifact-domain",
    "crates/artifact-application",
    "crates/artifact-infrastructure",
    "crates/artifact-contract",
    "crates/artifact-client",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/luqizheng/smark-artifact-service"

[workspace.dependencies]
artifact-domain = { path = "crates/artifact-domain" }
artifact-application = { path = "crates/artifact-application" }
artifact-infrastructure = { path = "crates/artifact-infrastructure" }
artifact-contract = { path = "crates/artifact-contract" }
artifact-client = { path = "crates/artifact-client" }

axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"

[profile.release]
lto = "thin"
strip = "debuginfo"
