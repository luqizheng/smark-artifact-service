# ART-03B-01 — 独立 Worker 服务 override
#
# 用法（不修改基础 compose 文件）：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.worker.yml up -d --build
#
# 约束：
#   * Worker 是独立进程，使用独立 DB 账号（ARTIFACT_WORKER_DATABASE_URL）；
#     绝不复用 API 的 ARTIFACT_API_DATABASE_URL / 角色。口令若含 URL 保留字符需要百分号编码。
#   * WP-AS-06：镜像包含 Node + vendored SeeCode；执行循环仅在下列
#     ARTIFACT_WORKER_SEECODE_CLI_PATH / ARTIFACT_WORKER_FILE_* 五项全部
#     配置时启用（all-or-nothing），缺省仍为协调维护-only。
#   * 生产隔离（只读根文件系统、无外网、资源配额）属于 ART-03B-03，本文件不伪造完成。

services:
  artifact-worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    image: artifact-worker:local
    restart: unless-stopped
    # 等迁移与授权都完成之后再启动：Worker 角色由 db-grants 创建。
    depends_on:
      db-grants:
        condition: service_completed_successfully
    environment:
      # 必须指向 deploy/db-roles.sql 创建的 __WORKER_ROLE__，不是 API role。
      ARTIFACT_WORKER_DATABASE_URL: postgres://artifact_worker:${ARTIFACT_WORKER_DB_PASSWORD:?set ARTIFACT_WORKER_DB_PASSWORD}@postgres:5432/artifact_service
      ARTIFACT_WORKER_ID: ${ARTIFACT_WORKER_ID:-artifact-worker-1}
      # 协调维护（租约恢复 + 输入清理）的间隔，毫秒，>= 1000。
      ARTIFACT_WORKER_MAINTENANCE_INTERVAL_MS: ${ARTIFACT_WORKER_MAINTENANCE_INTERVAL_MS:-10000}
      ARTIFACT_WORKER_LOG: ${ARTIFACT_WORKER_LOG:-info}
      ARTIFACT_WORKER_DB_MAX_CONNECTIONS: ${ARTIFACT_WORKER_DB_MAX_CONNECTIONS:-4}
      # ── WP-AS-06 执行面（五项 all-or-nothing；全缺 = 协调-only） ──────────
      # 默认全空 = 不启用执行循环。启用示例：
      #   ARTIFACT_WORKER_SEECODE_CLI_PATH=/opt/seecode/scripts/seecode.mjs
      #   ARTIFACT_WORKER_FILE_SERVICE_URL=http://file-service:8082
      #   ARTIFACT_WORKER_FILE_TOKEN_SERVICE_URL=http://token-service:8082
      #   ARTIFACT_WORKER_FILE_BOOTSTRAP_TOKEN=<bootstrap-credential>
      #   ARTIFACT_WORKER_FILE_LMMS_TID=1
      ARTIFACT_WORKER_SEECODE_CLI_PATH: ${ARTIFACT_WORKER_SEECODE_CLI_PATH:-}
      ARTIFACT_WORKER_FILE_SERVICE_URL: ${ARTIFACT_WORKER_FILE_SERVICE_URL:-}
      ARTIFACT_WORKER_FILE_TOKEN_SERVICE_URL: ${ARTIFACT_WORKER_FILE_TOKEN_SERVICE_URL:-}
      ARTIFACT_WORKER_FILE_BOOTSTRAP_TOKEN: ${ARTIFACT_WORKER_FILE_BOOTSTRAP_TOKEN:-}
      ARTIFACT_WORKER_FILE_LMMS_TID: ${ARTIFACT_WORKER_FILE_LMMS_TID:-}
      ARTIFACT_WORKER_LEASE_SECONDS: ${ARTIFACT_WORKER_LEASE_SECONDS:-300}
