name: ci

on:
  push:
    branches: [main, 'docs/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-test:
    name: clippy + build + test (postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artifact_service
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d artifact_service"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/artifact_service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: unit + integration + contract + invariant tests
        run: cargo test --workspace
      - name: release binary builds without test-doubles feature
        run: cargo build --release -p artifact-api
        env:
          ARTIFACT_GIT_SHA: ${{ github.sha }}
      - name: worker binary builds without test-doubles feature
        run: cargo build --release -p artifact-worker
        env:
          ARTIFACT_GIT_SHA: ${{ github.sha }}
      - name: released migrations are immutable
        run: |
          # migrations.sha256 列出每个迁移的内容哈希；新增迁移在同一个 PR 里加一行，
          # 之后该文件不得再修改（测试 migration_guard 用同一份清单再校验一次）。
          sha256sum -c migrations.sha256

  docker-build:
    name: docker images + compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build images
        run: |
          docker build \
            --build-arg ARTIFACT_GIT_SHA=${{ github.sha }} \
            -t artifact-api:ci .
          # 与 API 镜像共用 builder 阶段的层缓存。
          docker build \
            --build-arg ARTIFACT_GIT_SHA=${{ github.sha }} \
            -f Dockerfile.worker \
            -t artifact-worker:ci .
      - name: entrypoint smoke (unknown command exits 1 from the binary, not the shell)
        run: |
          set +e
          docker run --rm artifact-api:ci __no_such_command__
          code=$?
          docker run --rm artifact-worker:ci __no_such_command__
          worker_code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 for unknown command, got $code"
            exit 1
          fi
          if [ "$worker_code" -ne 1 ]; then
            echo "expected exit 1 for worker unknown command, got $worker_code"
            exit 1
          fi
      - name: compose files are valid
        run: |
          ARTIFACT_APP_DB_PASSWORD=ci ARTIFACT_WORKER_DB_PASSWORD=ci \
            docker compose -f deploy/docker-compose.yml config -q
          ARTIFACT_APP_DB_PASSWORD=ci ARTIFACT_WORKER_DB_PASSWORD=ci \
            docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.worker.yml config -q
      - name: grant script parses
        run: bash -n deploy/dev-grants.sh
