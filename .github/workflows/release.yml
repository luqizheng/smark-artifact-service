name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-image:
    name: build & publish image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 两个镜像共用同一个 builder 阶段：第二个构建直接复用层缓存。
      - name: build images
        run: |
          docker build \
            --build-arg ARTIFACT_GIT_SHA=${GITHUB_SHA} \
            -t ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME} \
            -t ghcr.io/${{ github.repository }}:latest .
          docker build \
            --build-arg ARTIFACT_GIT_SHA=${GITHUB_SHA} \
            -f Dockerfile.worker \
            -t ghcr.io/${{ github.repository }}/artifact-worker:${GITHUB_REF_NAME} \
            -t ghcr.io/${{ github.repository }}/artifact-worker:latest .
      - name: login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: push
        run: |
          docker push ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}/artifact-worker:${GITHUB_REF_NAME}
          docker push ghcr.io/${{ github.repository }}/artifact-worker:latest

  github-release:
    name: github release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
