openapi: 3.1.0
info:
  title: SMARK Artifact Service API
  version: 1.0.0-art03b
  description: |
    独立 Artifact Service 的 V1 API（契约基线 = AI-PM ART-01 V1.0）。

    ART-02 实施状态（与 docs/implementation/artifact-service/ART-02-API-STATUS.md 一致）：
    - `已实现`：health、ready、generators、Artifact 元数据 CRUD、References、
      GenerationJob 查询/取消。
    - `被 P0 阻断`：Version 上传会话与 commit（file-service 上传/finalize 协议缺失）。
    - `未实现`：GenerationJob 创建（Generator Adapter 未实现 → 503 GENERATOR_UNAVAILABLE）。

    相对 ART-01 V1.0 的增量（已由用户确认并纳入 ART-01 V1 正式契约，见本仓库 `docs/architecture/ART-01-V1-API-ERRATA-001.md`；均为向后兼容的新增）：
    - `GenerationJob` 响应新增 `error_code`、`attempt_count`、`max_attempts`、`cancel_requested`；
    - `requestGeneration` 文档化 409（Idempotency-Key 冲突）与 413（请求体超过 256 KiB）。

    授权：业务端点要求 `Authorization: Bearer <短时项目/动作范围委托凭证>`；
    当前生产验证器 fail-closed（P0 关闭前一切业务请求 401/403），详见安全状态文档。
servers:
  - url: http://127.0.0.1:8110
    description: local dev
tags:
  - name: meta
    description: 健康/就绪/元信息
  - name: generators
    description: Generator 注册表
  - name: artifacts
    description: Artifact 元数据与版本
  - name: references
    description: 外部业务引用
  - name: generation
    description: 生成任务
security:
  - bearerDelegation: []

paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [meta]
      security: []
      summary: 进程存活检查（不探测外部依赖）
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/ready:
    get:
      operationId: getReady
      tags: [meta]
      security: []
      summary: 依赖就绪检查
      description: 数据库可达即 ready；file_storage 组件如实上报 protocol_blocked_p0。
      responses:
        "200":
          description: 就绪
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: 未就绪（同一 schema，status=not_ready）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }

  /v1/generators:
    get:
      operationId: listGenerators
      tags: [generators]
      summary: 查询 Generator 注册表（需委托凭证 + generation:read 动作；状态如实上报 available/unavailable/disabled）
      description: >-
        WP-03 认证修复（Q3）：本端点要求有效 delegation（Bearer）；无凭证 → 401，
        缺 `generation:read` 动作 → 403。注册表全局共享（不按 project 分片），
        无需 X-Project-Id 头。
      responses:
        "200":
          description: Generator 列表
          content:
            application/json:
              schema:
                type: object
                required: [generators]
                properties:
                  generators:
                    type: array
                    items: { $ref: "#/components/schemas/Generator" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/artifacts:
    post:
      operationId: createArtifact
      tags: [artifacts]
      summary: 创建逻辑 Artifact（支持 Idempotency-Key）
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateArtifactRequest" }
      responses:
        "201":
          description: 创建成功（ETag 头返回并发锚）
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Artifact-Resolution: { $ref: "#/components/headers/ArtifactResolution" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "200":
          description: >-
            未新建资源：`existing_key` 表示同 artifact_key 同创建指纹；
            `idempotency_replay` 表示完成的 Idempotency-Key 重放（同时携带
            X-Idempotent-Replay: true）。
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Artifact-Resolution: { $ref: "#/components/headers/ArtifactResolution" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: >-
            `IDEMPOTENCY_KEY_REUSED`（同 Idempotency-Key 不同请求体）、
            `ARTIFACT_KEY_CONFLICT`（同 artifact_key 不同创建指纹）或
            `ARTIFACT_KEY_LEGACY_UNVERIFIABLE`（历史 key 无持久化身份）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Error" }
    get:
      operationId: listArtifacts
      tags: [artifacts]
      summary: 按项目分页查询 Artifact（cursor 分页）
      parameters:
        - { $ref: "#/components/parameters/ProjectIdHeader" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: artifact_type
          in: query
          schema: { type: string }
        - name: lifecycle_state
          in: query
          schema: { type: string, enum: [active, archived, deleted] }
      responses:
        "200":
          description: 分页结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/artifacts/{artifact_id}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      summary: 查询 Artifact 元数据与当前版本指针
      parameters:
        - { $ref: "#/components/parameters/ArtifactId" }
        - { $ref: "#/components/parameters/ProjectIdHeader" }
      responses:
        "200":
          description: 元数据（ETag 头）
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: patchArtifact
      tags: [artifacts]
      summary: 修改非版本元数据（If-Match 乐观并发）
      parameters:
        - { $ref: "#/components/parameters/ArtifactId" }
        - { $ref: "#/components/parameters/ProjectIdHeader" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateArtifactRequest" }
      responses:
        "200":
          description: 已更新（新 ETag）
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/artifacts/{artifact_id}/versions:
    post:
      operationId: createVersionSession
      tags: [artifacts]
      summary: 创建 pending 版本会话（WP-AS-05：对象须已上传 file-service）
      description: |
        调用方须先把对象上传至 file-service（自行持服务身份），再以
        `source_object_id` + `source_sha256` 创建会话。创建时 AS 以带 tid
        的服务令牌 head 对象（fail-early）；sha256 在 commit 时下载重算比对。
        Version 以 `pending` 状态创建（version_number 由服务端分配），
        `Location` 头指向版本资源。
      parameters:
        - { $ref: "#/components/parameters/ArtifactId" }
        - { $ref: "#/components/parameters/ProjectIdHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVersionSessionRequest" }
      responses:
        "201":
          description: "pending Version 已创建（Location 头指向版本资源）"
          headers:
            Location:
              description: "/v1/artifacts/{artifact_id}/versions/{version_id}"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503":
          description: STORAGE_UNAVAILABLE（对象面不可达 / 委托缺 lmms_tid；阻断原因见 details）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listVersions
      tags: [artifacts]
      summary: 列出版本（version_number 降序）
      parameters:
        - { $ref: "#/components/parameters/ArtifactId" }
        - { $ref: "#/components/parameters/ProjectIdHeader" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: 版本列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/artifacts/{artifact_id}/versions/{version_id}:
    get:
      operationId: getVersion
      tags: [artifacts]
      summary: 查询版本
      parameters:
        - { $ref: "#/components/parameters/ArtifactId" }
        - { $ref: "#/components/parameters/VersionId" }
        - { $ref: "#/components/parameters/ProjectIdHeader" }
      responses:
        "200":
          description: 版本详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/artifacts/{artifact_id}/versions/{version_id}/commit:
    post:
      operationId: commitVersion
      tags: [artifacts]
      summary: 校验对象指纹并提交 Version（WP-AS-05 提交协议）
      description: |
        提交协议（WP 契约 v0.3 §12"上传+校验+补偿"近似）：AS 以带 tid 的
        服务令牌下载对象并重算 sha256，与会话声明比对（不符 400）；随后
        单事务写入 ArtifactOutput（primary）并驱动 Version `pending → ready`
        （DB 触发器强制；READY 终态不可再变）。失败路径不删除调用方对象
        （重试幂等）；Version 非 pending → 409。
      parameters:
        - { $ref: "#/components/parameters/ArtifactId" }
        - { $ref: "#/components/parameters/VersionId" }
        - { $ref: "#/components/parameters/ProjectIdHeader" }
      responses:
        "200":
          description: Version 已提交（state=ready，manifest 含校验事实）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503":
          description: STORAGE_UNAVAILABLE（对象面不可达 / 委托缺 lmms_tid）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/artifacts/{artifact_id}/current-version:
    post:
      operationId: setCurrentVersion
      tags: [artifacts]
      summary: 切换当前版本指针（只能指向 READY 版本；乐观并发）
      parameters:
        - { $ref: "#/components/parameters/ArtifactId" }
        - { $ref: "#/components/parameters/ProjectIdHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetCurrentVersionRequest" }
      responses:
        "200":
          description: 已切换（新 ETag）
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/artifacts/{artifact_id}/references:
    post:
      operationId: createReference
      tags: [references]
      summary: 建立外部业务引用（同引用重复创建返回既有记录）
      parameters:
        - { $ref: "#/components/parameters/ArtifactId" }
        - { $ref: "#/components/parameters/ProjectIdHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReferenceRequest" }
      responses:
        "201":
          description: 已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reference" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      operationId: listReferences
      tags: [references]
      summary: 列出有效引用
      parameters:
        - { $ref: "#/components/parameters/ArtifactId" }
        - { $ref: "#/components/parameters/ProjectIdHeader" }
      responses:
        "200":
          description: 引用列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferencePage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/artifacts/{artifact_id}/references/{reference_id}:
    delete:
      operationId: removeReference
      tags: [references]
      summary: 解除引用（软删除）
      parameters:
        - { $ref: "#/components/parameters/ArtifactId" }
        - { $ref: "#/components/parameters/ReferenceId" }
        - { $ref: "#/components/parameters/ProjectIdHeader" }
      responses:
        "204": { description: 已解除 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/artifacts/{artifact_id}/generation-jobs:
    post:
      operationId: requestGeneration
      tags: [generation]
      summary: 请求生成（Adapter 未实现 → 503 GENERATOR_UNAVAILABLE）
      description: |
        `input` 是版本化的 SeeCode 输入信封：`schema` 固定为 `smark.seecode.input`，
        `schema_version` 为服务端支持的版本（当前 `1`），`diagram` 必填且 `diagram.type` 非空。
        未知顶层字段、超出结构上限、危险字段名或 URL 形态的值一律 400，
        原因码与结构位置见 `error.details.reason` / `error.details.field`，响应不回显输入正文。
        整个请求体上限 256 KiB。`diagram` 内部逐字段的 JSON Schema 尚未冻结（ART-03A 验收项）。

        幂等：同一 Idempotency-Key 与相同请求体返回原 Job；同 key 不同请求体 → 409。
      parameters:
        - { $ref: "#/components/parameters/ArtifactId" }
        - { $ref: "#/components/parameters/ProjectIdHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGenerationJobRequest" }
      responses:
        "200":
          description: |
            已存在的 Job（重放）。不创建新 Job、不产生新 Job ID。
            `X-Generation-Job-Resolution` 区分 `caller_request_replay`（caller_request_id
            与指纹命中）与 `idempotency_replay`（Idempotency-Key 与请求体哈希命中）。
          headers:
            X-Generation-Job-Resolution:
              $ref: "#/components/headers/GenerationJobResolution"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationJob" }
        "202":
          description: 新建 Job（Adapter 落地前不可达）
          headers:
            X-Generation-Job-Resolution:
              $ref: "#/components/headers/GenerationJobResolution"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationJob" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            IDEMPOTENCY_KEY_REUSED（同 key 不同请求体）或 CALLER_REQUEST_ID_REUSED
            （同 caller_request_id 不同创建立指纹）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: PAYLOAD_TOO_LARGE — 请求体超过 256 KiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: |
            CALLER_REQUEST_ID_FINGERPRINT_VERSION_MISMATCH 或 IDEMPOTENCY_KEY_CROSS_IDENTITY
            — 持久化完整性冲突，失败关闭，不可重试。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: GENERATOR_UNAVAILABLE（SeeCode Adapter 未实现；Mermaid 不属于本服务）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/generation-jobs/by-caller-request/{caller_request_id}:
    get:
      operationId: getGenerationJobByCallerRequest
      tags: [generation]
      summary: 按 caller_request_id 解析 Job（Caller Request Lookup）
      description: |
        与 `GET /v1/generation-jobs/{job_id}` 完全相同的身份验证与授权模型：
        delegation token 决定 tenant，`X-Project-Id` 决定 project，
        需要 `GenerationRead` 授权。查询谓词强制 tenant + project + caller_request_id，
        跨 scope 与不存在统一返回 404（不泄露其他 tenant/project 是否存在该身份）。
        本端点只读：不修改状态、不创建记录。response 为现有标准 GenerationJob DTO。
      parameters:
        - name: caller_request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 调用方生成的请求身份。非法 UUID → 400。
        - { $ref: "#/components/parameters/ProjectIdHeader" }
      responses:
        "200":
          description: 命中的 Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationJob" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/generation-jobs/{job_id}:
    get:
      operationId: getJob
      tags: [generation]
      summary: 查询 Job 状态
      description: |
        轮询 Job 状态。响应不包含输入正文。`error_code` 在失败、超时或取消时给出稳定原因码；
        `cancel_requested=true` 表示 running 期间已收到取消请求、尚未由 Worker 确认。
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - { $ref: "#/components/parameters/ProjectIdHeader" }
      responses:
        "200":
          description: Job 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationJob" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/generation-jobs/{job_id}/cancel:
    post:
      operationId: cancelJob
      tags: [generation]
      summary: 取消 Job（尽力而为；终态 Job 原样返回）
      description: |
        queued / retry_wait 的 Job 直接取消，返回 `status=cancelled`。
        running 的 Job 只登记取消请求：仍返回 200 与 `status=running`，并以
        `cancel_requested=true` 表示请求已被接受，最终状态由 Worker 确认后给出。
        终态 Job 不改变状态，原样返回。
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - { $ref: "#/components/parameters/ProjectIdHeader" }
      responses:
        "200":
          description: 当前 Job 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationJob" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerDelegation:
      type: http
      scheme: bearer
      bearerFormat: delegation-jwt
      description: |
        短时、audience 固定、project/action scoped 的委托凭证（ART-01 §5.2）。
        ART-02 期间生产验证器 fail-closed：P0（resource token 未鉴权挂载、
        claims 缺 aud/tid）关闭前一切业务请求返回 401 UNAUTHENTICATED。

  headers:
    ETag:
      description: 并发锚，格式 "r<row_revision>"；更新请求以 If-Match 回传。
      schema: { type: string, example: '"r3"' }
    ArtifactResolution:
      description: 创建解析语义。created=新建；existing_key=同 artifact_key 同创建指纹；idempotency_replay=完成的 Idempotency-Key 重放。
      schema:
        type: string
        enum: [created, existing_key, idempotency_replay]
    GenerationJobResolution:
      description: |
        GenerationJob 创建解析语义（ART-04G v3 §5.5）。
        created=新建；caller_request_replay=caller_request_id 与创建立指纹命中已有 Job；
        idempotency_replay=Idempotency-Key 与请求体哈希命中已有 Job。
      schema:
        type: string
        enum: [created, caller_request_replay, idempotency_replay]

  parameters:
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: version_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReferenceId:
      name: reference_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectIdHeader:
      name: X-Project-Id
      in: header
      required: true
      description: 资源定位输入；必须与委托凭证 project 范围一致，否则 403。
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        创建类写请求幂等键；保留 ≥24h；同 key 不同请求体 → 409。
        规范化（ART-04G v3 §10.1）：前后 ASCII 空格（U+0020）被剥离；
        规范化后为空字符串等价于未提供（不参与幂等）；规范化后长度上限 255，
        超限 → 400 INVALID_IDEMPOTENCY_KEY。HTAB/CR/LF 不属于空白，不被剥离。
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Artifact ETag（如 "r3"）；不匹配 → 409 VERSION_CONFLICT。
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Error:
      description: 统一错误信封
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              description: 稳定错误码（ART-01 §8.1）。本枚举必须覆盖服务端实际会返回的
                全部稳定错误码（DomainError::code() 与 UNAUTHENTICATED），由
                contract_openapi::error_code_enum_covers_every_domain_error 双向校验。
                GENERATION_TIMEOUT 同时是 GenerationJob.error_code 的终态值。
              enum:
                - INVALID_REQUEST
                - UNAUTHENTICATED
                - SCOPE_DENIED
                - RESOURCE_NOT_FOUND
                - VERSION_CONFLICT
                - IDEMPOTENCY_KEY_REUSED
                - CALLER_REQUEST_ID_REUSED
                - INVALID_IDEMPOTENCY_KEY
                - CALLER_REQUEST_ID_FINGERPRINT_VERSION_MISMATCH
                - IDEMPOTENCY_KEY_CROSS_IDENTITY
                - ARTIFACT_KEY_CONFLICT
                - ARTIFACT_KEY_LEGACY_UNVERIFIABLE
                - PERSISTENCE_UNAVAILABLE
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - GENERATOR_VALIDATION_FAILED
                - RATE_LIMITED
                - STORAGE_UNAVAILABLE
                - GENERATOR_UNAVAILABLE
                - GENERATION_TIMEOUT
                - INTERNAL_ERROR
            message: { type: string }
            request_id: { type: [string, "null"] }
            retryable: { type: boolean }
            details:
              type: object
              additionalProperties: true

    Health:
      type: object
      required: [status, service, version, git_sha, built_at]
      properties:
        status: { type: string }
        service: { type: string }
        version: { type: string }
        git_sha: { type: string }
        built_at: { type: string }

    Ready:
      type: object
      required: [status, components, version]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        components:
          type: object
          required: [database, file_storage]
          properties:
            database: { type: string }
            file_storage: { type: string }
        version: { type: string }

    Generator:
      type: object
      required: [generator_id, display_name, version, status]
      properties:
        generator_id: { type: string }
        display_name: { type: string }
        version: { type: string }
        adapter_version: { type: [string, "null"] }
        supported_input_formats: { type: array, items: { type: string } }
        supported_output_formats: { type: array, items: { type: string } }
        capabilities: { type: object }
        status: { type: string, enum: [available, unavailable, disabled] }
        status_reason: { type: [string, "null"] }

    CreateArtifactRequest:
      type: object
      required: [project_id, name, artifact_type]
      properties:
        project_id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        artifact_type:
          type: string
          enum: [document, report, image, diagram, visualization, presentation, dataset, media, file]
        artifact_key:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            可选的稳定创建键。创建后不可变、按 tenant/project 作用域唯一且永不复用；
            同 key 同语义载荷返回原 Artifact（200），同 key 不同载荷返回
            ARTIFACT_KEY_CONFLICT（409）。历史 key 无持久化身份时返回
            ARTIFACT_KEY_LEGACY_UNVERIFIABLE（409）并需人工对账。
            空串、首尾空白或控制字符返回 400。
        description: { type: string }
        category: { type: string }

    UpdateArtifactRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }

    Artifact:
      type: object
      required:
        [id, tenant_id, project_id, name, artifact_type, lifecycle_state,
         current_version_id, created_by, created_at, updated_at, etag]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        artifact_key: { type: [string, "null"] }
        name: { type: string }
        description: { type: [string, "null"] }
        artifact_type: { type: string }
        category: { type: [string, "null"] }
        lifecycle_state: { type: string, enum: [active, archived, deleted] }
        current_version_id: { type: [string, "null"], format: uuid }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
        etag: { type: string, example: '"r1"' }

    ArtifactPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Artifact" } }
        next_cursor: { type: [string, "null"] }

    CreateVersionSessionRequest:
      type: object
      required: [source_object_id, source_sha256]
      properties:
        source_format: { type: string }
        source_object_id:
          type: string
          description: file-service 对象 id（调用方先上传；创建时 AS head 校验存在性）
        source_sha256:
          type: string
          description: 调用方声明的对象 SHA-256（64 位 hex；commit 时下载重算比对）

    ArtifactVersion:
      type: object
      required: [id, artifact_id, version_number, state, manifest, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        artifact_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        state: { type: string, enum: [pending, ready, failed, quarantined] }
        source_format: { type: [string, "null"] }
        source_object_id: { type: [string, "null"] }
        source_sha256: { type: [string, "null"] }
        generator_id: { type: [string, "null"] }
        generator_version: { type: [string, "null"] }
        adapter_version: { type: [string, "null"] }
        manifest: { type: object }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        ready_at: { type: [string, "null"], format: date-time }
        failure_code: { type: [string, "null"] }

    VersionPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ArtifactVersion" } }
        next_cursor: { type: [string, "null"] }

    ArtifactOutput:
      type: object
      required: [id, version_id, output_role, format, mime_type, size_bytes, sha256, file_object_id, safety_status]
      properties:
        id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        output_role: { type: string, enum: [primary, preview, attachment, source-map] }
        format: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        sha256: { type: string }
        file_object_id: { type: string }
        safety_status: { type: string, enum: [pending, passed, rejected] }
        created_at: { type: string, format: date-time }

    CreateReferenceRequest:
      type: object
      required: [owner_type, owner_id, relation_type]
      properties:
        owner_type:
          type: string
          enum: [requirement, design, adr, task, knowledge, project]
        owner_id: { type: string, minLength: 1 }
        relation_type:
          type: string
          enum: [generated_from, illustrates, supports, references, evidence_for, delivered_by]

    Reference:
      type: object
      required: [id, artifact_id, owner_type, owner_id, relation_type, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        artifact_id: { type: string, format: uuid }
        owner_type: { type: string }
        owner_id: { type: string }
        relation_type: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    ReferencePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Reference" } }
        next_cursor: { type: [string, "null"] }

    SetCurrentVersionRequest:
      type: object
      required: [version_id]
      properties:
        version_id: { type: string, format: uuid }
        expected_current_version_id:
          type: [string, "null"]
          format: uuid
          description: 乐观并发；与当前指针不一致 → 409 VERSION_CONFLICT。

    CreateGenerationJobRequest:
      type: object
      required: [generator_id, input, caller_request_id]
      properties:
        generator_id: { type: string }
        caller_request_id:
          type: string
          format: uuid
          description: |
            调用方生成的请求身份（ART-04G v3 §5.5）。同 tenant/project 内唯一：
            相同 caller_request_id 与相同创建立指纹的重放解析回同一 Job（不创建新 Job、
            不产生新 Job ID），指纹不同 → 409 CALLER_REQUEST_ID_REUSED。
            指纹覆盖服务端解析的 tenant/project、artifact_id、caller_request_id、
            规范化 generator_id、input 与 options；不包含 Idempotency-Key 与传输层哈希。
        input:
          type: object
          description: |
            版本化的 SeeCode 输入信封。必填 `schema`（固定 `smark.seecode.input`）、
            `schema_version`（当前 `1`）、`diagram`（含非空 `type`）。
            顶层只允许 `schema`、`schema_version`、`diagram`、`options`、`provenance`。
            结构上限：请求体 256 KiB、嵌套深度 16、`diagram.nodes` ≤ 500、`diagram.edges` ≤ 2000、
            单个文本 4 KiB、单个数组或对象的元素 4096。
            不接受 URL / 路径 / 脚本 / 命令 / 环境变量 / 凭据类字段名，也不接受 URL 形态的值。
        options: { type: object }
        expected_current_version_id: { type: [string, "null"], format: uuid }

    GenerationJob:
      type: object
      required:
        [id, artifact_id, generator_id, status, error_code, attempt_count, max_attempts,
         cancel_requested, created_at, poll_url]
      properties:
        id: { type: string, format: uuid }
        artifact_id: { type: string, format: uuid }
        target_version_id:
          type: [string, "null"]
          format: uuid
          description: |
            目标 Version（稳定精确结果引用；ART-04 §211 加法性暴露）。
            Job 创建未预分配时由输出提交事务物化，committed 前为 null。
        generator_id: { type: string }
        caller_request_id:
          type: [string, "null"]
          format: uuid
          description: |
            Durable caller identity（ART-04G v3 §5.1）。迁移前创建的 legacy Job 为 null；
            AS-2 之后创建的 Job 必然非空，且写入后永久不可变。
        status:
          type: string
          enum: [queued, running, retry_wait, succeeded, cancelled, timed_out, failed]
        error_code:
          type: [string, "null"]
          description: |
            失败、超时或取消的稳定原因码；成功时为 null，retry_wait 时为最近一次失败的原因。
            已知取值（非穷尽，调用方必须容忍未知值）：
            GENERATOR_VALIDATION_FAILED、GENERATOR_EXECUTION_FAILED、GENERATION_TIMEOUT、
            OUTPUT_REJECTED、STORAGE_UNAVAILABLE、MAX_ATTEMPTS_EXCEEDED、CANCELLED、QUEUE_EXPIRED。
        attempt_count: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 1 }
        cancel_requested:
          type: boolean
          description: running 期间已收到取消请求、尚未由 Worker 确认。
        created_at: { type: string, format: date-time }
        poll_url: { type: string }
